<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Zone Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>

<div id="app">

  <!-- ================= LOGIN (Premium SaaS) ================= -->
  <section id="view-login" class="view view--login">
    <!-- LoginPage > LoginCard -->
    <div class="login-card">
      <!-- LoginCard > LoginHeader -->
      <div class="login-card-header">
        <div class="login-badge">
          <span class="material-symbols-outlined">sports_esports</span>
        </div>
        <h1 class="login-title">Zone Manager</h1>
        <p class="login-subtitle">Zonangizni boshqaring</p>
        <svg class="login-wave-svg" viewBox="0 0 750 56" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,40 C220,64 500,16 750,40 L750,58 L0,58 Z" fill="#ffffff"/>
        </svg>
      </div>

      <!-- LoginCard > LoginForm -->
      <div class="login-card-body">
        <form id="login-form" class="login-form" novalidate>
          <!-- Input: Login -->
          <div class="field">
            <label for="login-username">Login</label>
            <div class="input-wrap">
              <span class="input-icon material-symbols-outlined">person</span>
              <input id="login-username" type="text" placeholder="Loginni kiriting" autocomplete="username" aria-label="Login">
            </div>
            <span class="field-error" id="err-username"></span>
          </div>

          <!-- Input: Parol -->
          <div class="field">
            <label for="login-password">Parol</label>
            <div class="input-wrap">
              <span class="input-icon material-symbols-outlined">lock</span>
              <input id="login-password" type="password" placeholder="Parolni kiriting" autocomplete="current-password" aria-label="Parol">
              <button type="button" class="eye" id="eye-toggle" aria-label="Parolni ko'rsatish">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
            <span class="field-error" id="err-password"></span>
          </div>

          <!-- FormOptions -->
          <div class="form-options">
            <button type="button" class="forgot-link" id="forgot-link">Parolni unutdingizmi?</button>
          </div>

          <div class="login-error" id="login-error" hidden>Login yoki parol noto'g'ri</div>

          <!-- LoginButton -->
          <button type="submit" class="btn btn--login" id="login-btn" aria-label="Kirish">
            <span class="btn-label">Kirish</span>
            <span class="arrow-ic material-symbols-outlined">arrow_forward</span>
            <span class="spinner" hidden></span>
          </button>

          <!-- Divider -->
          <div class="divider"><span>yoki</span></div>

          <!-- DemoLogin -->
          <button type="button" class="demo-btn" id="demo-btn">
            <span class="material-symbols-outlined">verified_user</span>
            Demo kirish: admin / 1234
          </button>
        </form>

        <!-- SecurityFooter -->
        <div class="security-footer">
          <span class="material-symbols-outlined">shield</span>
          Xavfsiz va himoyalangan tizim
        </div>
      </div>
    </div>
  </section>

  <!-- ================= ASOSIY (Home) ================= -->
  <section id="view-home" class="view" hidden>
    <header class="app-header">
      <h1>Asosiy Floor</h1>
      <div class="search-box">
        <input id="search-input" class="search-input" placeholder="Stol nomi..." hidden>
        <button class="icon-btn" id="search-toggle" aria-label="Qidirish">
          <span class="material-symbols-outlined">search</span>
        </button>
        <button class="icon-btn" id="more-btn" aria-label="Ko'proq">
          <span class="material-symbols-outlined">more_vert</span>
        </button>
      </div>
    </header>

    <div class="chips" id="filter-chips">
      <button class="chip active" data-filter="all">Barchasi</button>
      <button class="chip" data-filter="free">Bo'sh</button>
      <button class="chip" data-filter="busy">Band</button>
      <button class="chip" data-filter="repair">Ta'mirlashda</button>
    </div>

    <div id="home-empty" class="empty-state" hidden>
      <span class="material-symbols-outlined empty-icon">table_restaurant</span>
      <p>Hali stol qo'shilmagan</p>
      <button class="btn btn--primary" id="first-table-btn">Birinchi stolni qo'shish</button>
    </div>

    <main class="grid" id="table-grid"></main>
  </section>

  <!-- ================= ZONALAR ================= -->
  <section id="view-zones" class="view" hidden>
    <header class="app-header app-header--title">
      <h1>Zonalar</h1>
    </header>
    <div class="segmented segmented--scroll" id="zone-tabs"></div>
    <div id="zones-table-list"></div>
    <button class="btn btn--outline btn--block" id="add-zone-btn">+ Yangi zona qo'shish</button>
  </section>

  <!-- ================= PROFIL ================= -->
  <section id="view-profile" class="view" hidden>
    <header class="app-header app-header--title">
      <h1>Profil</h1>
    </header>
    <div class="profile-card">
      <div class="profile-avatar"><span class="material-symbols-outlined">person</span></div>
      <div class="profile-info">
        <p class="profile-name" id="profile-name">Admin</p>
        <p class="profile-login" id="profile-login">admin</p>
      </div>
      <span class="badge badge--role">Egasi</span>
      <button class="icon-btn" id="edit-profile-btn" title="Tahrirlash">
        <span class="material-symbols-outlined">edit</span>
      </button>
    </div>
    <div class="list-group">
      <button class="list-row list-row--danger" id="logout-btn">
        <span class="list-row-left"><span class="material-symbols-outlined">logout</span> Chiqish</span>
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </section>

  <!-- ================= MAHSULOTLAR ================= -->
  <section id="view-products" class="view" hidden>
    <header class="app-header app-header--title">
      <h1>Mahsulotlar</h1>
    </header>
    <div class="segmented segmented--scroll" id="prod-tabs"></div>
    <ul class="list-group" id="products-list"></ul>
    <button class="btn btn--outline btn--block" id="add-product-btn">+ Yangi mahsulot qo'shish</button>
  </section>

  <!-- ================= PASTKI NAVIGATSIYA ================= -->
  <nav class="bottom-nav" id="bottom-nav" hidden>
    <button class="nav-btn active" data-tab="home">
      <span class="material-symbols-outlined">home</span>
      <span>Asosiy</span>
    </button>
    <button class="nav-btn" data-tab="zones">
      <span class="material-symbols-outlined">grid_view</span>
      <span>Zonalar</span>
    </button>
    <button class="nav-btn" data-tab="products">
      <span class="material-symbols-outlined">local_bar</span>
      <span>Mahsulotlar</span>
    </button>
    <button class="nav-btn" data-tab="profile">
      <span class="material-symbols-outlined">person</span>
      <span>Profil</span>
    </button>
  </nav>

  <!-- ================= MODAL (bottom sheet) ================= -->
  <div class="overlay" id="sheet" hidden>
    <div class="sheet" id="sheet-body" role="dialog"></div>
  </div>

  <!-- ================= ALERT ================= -->
  <div class="overlay overlay--center" id="alert" hidden>
    <div class="alert-box" id="alert-body" role="alertdialog"></div>
  </div>

  <!-- ================= TOASTS ================= -->
  <div class="toasts" id="toasts"></div>

</div>

<script src="app.js?v=20"></script>
</body>
</html>
